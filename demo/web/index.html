<title>Sentiment Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar | chat. Empty state centers heading and composer (Grok style); once a thread exists the composer docks at the bottom.
   Dark by default. Colour appears only with a verdict: the composer rim and a soft aura take the verdict tone.
   Key buttons (new chat, model picker, theme) turn into black blurred glass on hover. */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --tone{syntax:'<color>';inherits:true;initial-value:rgba(128,128,128,0)}
@property --rim{syntax:'<color>';inherits:true;initial-value:rgba(128,128,128,0)}

:root{
  --bg:#0C0E11; --side:#0B0D10; --fg:#F7F8FA; --muted:#B6BBC4;
  --panel:rgba(20,23,28,.94); --line-2:rgba(255,255,255,.24);
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.095);
  --line:rgba(255,255,255,.11); --hi:rgba(255,255,255,.15);
  --key-bg:rgba(0,0,0,.62); --key-fg:#FFFFFF; --key-line:rgba(255,255,255,.24);
  --pos:#3DD6A0; --neu:#E3B341; --neg:#FF6B6B;
  --b1:rgba(56,132,196,.34); --b2:rgba(46,168,150,.24); --b3:rgba(130,140,170,.20); --rim-idle:rgba(190,220,255,.75);
  --bc1:#4285F4; --bc2:#9B72CB; --bc3:#D96570; --bc4:#F4B400; --beam-dim:#2B3140;
  --ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F5F7; --side:#ECEEF1; --fg:#0A0C0F; --muted:#3A3F47;
  --panel:rgba(255,255,255,.96); --line-2:rgba(20,22,26,.30);
  --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.92);
  --line:rgba(20,22,26,.12); --hi:rgba(255,255,255,.95);
  --key-bg:rgba(12,14,18,.88); --key-fg:#FFFFFF; --key-line:rgba(12,14,18,.5);
  --pos:#0E9F6E; --neu:#B7791F; --neg:#D6453D;
  --b1:rgba(110,170,225,.42); --b2:rgba(120,205,190,.34); --b3:rgba(190,200,225,.45); --rim-idle:rgba(50,100,160,.55);
  --bc1:#1A73E8; --bc2:#8430CE; --bc3:#D93025; --bc4:#E37400; --beam-dim:#CBD2DE;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:500 16px/1.6 var(--ui);-webkit-font-smoothing:antialiased;margin:0;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button[disabled],[aria-disabled="true"]{cursor:default}
:focus-visible{outline:2px solid color-mix(in srgb,var(--fg) 70%,transparent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.glass{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}

/* key buttons: black blurred glass on hover */
.key{display:inline-flex;align-items:center;gap:10px;border-radius:12px;border:1px solid transparent;
  transition:background .25s,color .25s,border-color .25s,box-shadow .25s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.key:hover,.key:focus-visible,.key[aria-expanded="true"]{background:var(--key-bg);color:var(--key-fg);border-color:var(--key-line);
  box-shadow:0 10px 28px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.key:active{transform:scale(.97)}
.icon{width:38px;height:38px;border-radius:50%;justify-content:center;color:var(--muted);background:var(--glass);border-color:var(--line);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
.icon:hover{color:var(--key-fg)}

/* shell */
.shell{position:relative;isolation:isolate;display:grid;grid-template-columns:var(--sw,272px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;transition:grid-template-columns .4s cubic-bezier(.2,.7,.2,1),--tone .9s ease}
/* beam colours follow the verdict; idle uses the Gemini palette defined on :root */
.shell[data-tone="pos"]{--tone:var(--pos);--bc1:#00D2FF;--bc2:#0D9488;--bc3:var(--pos);--bc4:#6EE7B7}
.shell[data-tone="neu"]{--tone:var(--neu);--bc1:#D97706;--bc2:var(--neu);--bc3:#FBBF24;--bc4:#FDE047}
.shell[data-tone="neg"]{--tone:var(--neg);--bc1:#9333EA;--bc2:#C026D3;--bc3:#E11D48;--bc4:var(--neg)}
.shell[data-side="closed"]{--sw:0px}
.side{background:var(--side);border-right:1px solid var(--line-2);overflow:clip;min-width:0;display:flex;flex-direction:column}
.side-in{width:272px;height:100%;display:flex;flex-direction:column;gap:14px;padding:14px 12px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));overflow-y:auto;overflow-x:clip}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 0 6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:-.01em}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--fg)}
.newchat{padding:10px 14px;font-weight:500;background:var(--glass);border-color:var(--line);width:100%;box-shadow:inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
.search{display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:12px;height:40px;color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:14px}
.search input::placeholder{color:var(--muted)}
.grp{font-size:13px;color:var(--muted);padding:6px 10px 0}
.recent{display:grid;gap:2px}
.rec{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .25s,color .25s}
.rec:hover{background:var(--key-bg);color:var(--key-fg);box-shadow:inset 0 0 0 1px var(--key-line)}
.rec[aria-current="true"]{background:var(--glass-2);color:var(--fg)}
.none{padding:6px 10px;color:var(--muted);font-size:13.5px;margin:0}
.soon{display:grid;gap:2px}
.soon div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:14px;opacity:.7}
.soon em{margin-left:auto;font-style:normal;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--glass);box-shadow:inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--glass-2);border:1px solid var(--line)}
.me b{display:block;font-weight:500;font-size:14px;line-height:1.2}
.me span{font-size:12.5px;color:var(--muted)}

/* app */
.app{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
/* ambient fluid layer: always on, so every glass surface has something to blur, before and after a result */
.aura{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aura .b{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform;animation:drift 26s ease-in-out infinite alternate}
.aura .b1{width:56vmax;height:56vmax;left:-18vmax;top:8%;background:var(--b1)}
.aura .b2{width:48vmax;height:48vmax;right:-14vmax;bottom:-16vmax;background:var(--b2);animation-duration:32s;animation-delay:-8s}
.aura .b3{width:36vmax;height:36vmax;left:38%;top:-18vmax;background:var(--b3);animation-duration:38s;animation-delay:-16s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6vmax,-4vmax,0) scale(1.18)}}
.top{flex:none;min-height:58px;position:relative;z-index:2;display:flex;align-items:center;gap:6px;padding:10px 12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
.top .sp{margin-left:auto}
.openside{display:none}
.shell[data-side="closed"] .openside{display:inline-flex}

.main{flex:1;min-height:0;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;
  -webkit-mask-image:linear-gradient(transparent,#000 18px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(transparent,#000 18px,#000 calc(100% - 26px),transparent)}
.thread-in{max-width:760px;margin:0 auto;width:100%;padding-block:12px 28px;display:grid;gap:28px}
.dock{flex:none;max-width:760px;width:100%;margin:0 auto;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));display:grid;gap:12px;position:relative}
.main.is-empty{justify-content:center;padding-bottom:6vh}
.main.is-empty .thread{flex:none;overflow:visible;-webkit-mask-image:none;mask-image:none}
.main.is-empty .thread-in{padding-block:0 26px}
.empty-h{margin:0;text-align:center;font-size:clamp(28px,5vw,42px);font-weight:500;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}

/* messages */
.m-user{justify-self:end;max-width:min(82%,560px);padding:10px 18px;border-radius:22px 22px 6px 22px;white-space:pre-wrap;overflow-wrap:anywhere}
.m-ai{display:grid;gap:18px;min-width:0}
.m-text{color:var(--muted);margin:0}
.verdict{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.verdict .word{font-size:clamp(34px,6vw,46px);font-weight:500;letter-spacing:-.03em;line-height:1.05}
.verdict .pct{font-size:clamp(18px,3vw,22px);font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tide-wrap{max-width:460px;width:100%}
.tide{position:relative;height:12px;border-radius:99px;border:1px solid var(--line);
  background:linear-gradient(90deg,color-mix(in srgb,var(--neg) 38%,transparent),color-mix(in srgb,var(--neu) 30%,transparent) 50%,color-mix(in srgb,var(--pos) 38%,transparent))}
.drop{position:absolute;top:50%;left:var(--x,50%);width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.95),var(--tone) 58%);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--tone) 18%,transparent),0 8px 22px color-mix(in srgb,var(--tone) 45%,transparent);
  transition:left 1s cubic-bezier(.34,1.56,.64,1)}
.tide-labels{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--muted)}
.sentence{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:clamp(17px,2.6vw,20px);line-height:1.5}
.w{position:relative;padding:2px 7px;border-radius:9px;margin-left:-7px;
  background:color-mix(in srgb,var(--c,transparent) calc(var(--s,0)*34%),transparent);transition:background .6s ease,box-shadow .2s}
.sentence .w:first-child{margin-left:0}
.w.pos{--c:var(--pos)} .w.neg{--c:var(--neg)}
.w[aria-pressed="true"]{box-shadow:0 0 0 1px var(--line)}
.w .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;z-index:5;
  background:var(--key-bg);color:var(--key-fg);border:1px solid var(--key-line);border-radius:10px;padding:6px 10px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .15s;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.w:hover .tip,.w:focus-visible .tip{opacity:1}

details{max-width:560px;width:100%;border-radius:18px}
summary{list-style:none;cursor:pointer;padding:11px 18px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;border-radius:18px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:auto;transition:transform .25s}
details[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
details[open] summary{color:var(--fg)}
.why{padding:4px 18px 18px;display:grid;gap:18px;font-size:14px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.trk{width:38px;height:22px;border-radius:99px;background:var(--glass-2);border:1px solid var(--line);position:relative;transition:background .25s}
.trk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.switch input:checked + .trk{background:color-mix(in srgb,var(--tone) 50%,var(--glass-2))}
.switch input:checked + .trk::after{transform:translateX(16px)}
.switch input:focus-visible + .trk{outline:2px solid color-mix(in srgb,var(--fg) 70%,transparent);outline-offset:3px}
.probs{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:84px 1fr 44px;gap:12px;align-items:center;color:var(--muted)}
.pr .t{height:6px;border-radius:99px;background:var(--glass-2);overflow:hidden}
.pr .f{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.pr .v{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.dims{display:grid;gap:7px}
.dim{display:grid;grid-template-columns:112px 1fr 40px;gap:12px;align-items:center;color:var(--muted);font-size:13px}
.dim .t{height:4px;border-radius:99px;background:var(--glass-2);overflow:hidden}
.dim .f{display:block;height:100%;border-radius:99px;background:var(--fg);opacity:.7}
.dim .f.neg{background:var(--neg);opacity:.9} .dim .f.pos{background:var(--pos);opacity:.9}
.dim .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.note{color:var(--muted);font-size:13px;margin:0}
.src{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px;margin:0}

/* composer */
.composer{--beam-tone:var(--rim-idle);--rim:var(--rim-idle);position:relative;border-radius:26px;padding:12px 12px 10px 18px;display:grid;gap:6px;transition:background .25s,--rim .9s ease}
.app.has-result .composer{--beam-tone:var(--tone);--rim:var(--tone)}
/* denser surfaces: composer, user bubble and the details panel read as solid glass with a clear edge */
.composer.glass{background:var(--panel);border-color:var(--line-2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 var(--hi),0 10px 30px rgba(0,0,0,.28);transition:border-color .6s ease,box-shadow .6s ease}
.app.has-result .composer.glass{border-color:color-mix(in srgb,var(--tone) 35%,var(--line-2))}
.composer.glass:focus-within{background:var(--panel);border-color:color-mix(in srgb,var(--fg) 55%,transparent)}
.m-user.glass,details.glass{background:var(--panel);border-color:var(--line-2)}

/* Gemini-style border light: the whole border glows and a continuous colour band flows around it.
   The perimeter is split into 72 touching SVG dashes (pathLength="100", built in JS below), each with an
   interpolated colour; they all move together at the same speed on every side, so the gradient flows
   evenly instead of racing round the ends like a rotating conic gradient. Two brighter zones ride along. */
.beam-wrap{position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:.85;transition:opacity .4s ease}
.composer:focus-within .beam-wrap{opacity:1}
.beam-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.beam-svg rect{x:.75px;y:.75px;width:calc(100% - 1.5px);height:calc(100% - 1.5px);rx:26px;ry:26px;
  fill:none;stroke-linecap:butt;animation:beam-flow 9s linear infinite;transition:stroke .9s ease}
/* the colour band is drawn wide and opaque, then cut to a 1.6px line by ONE continuous mask stroke,
   so the thin edge is anti-aliased once instead of doubling up where neighbouring dashes overlap */
.beam-svg .line{stroke-width:5px}
.beam-svg .mask-line{stroke:#fff;stroke-width:1.6px;stroke-dasharray:none;animation:none}
.beam-svg .glow{stroke-width:6px;filter:blur(6px);opacity:.5}
:root[data-theme="light"] .beam-svg .glow{opacity:.3}
@keyframes beam-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@media (prefers-reduced-motion:reduce){.beam-svg rect{animation:none}}
.composer:focus-within{background:var(--glass-2)}
.composer textarea{width:100%;resize:none;background:transparent;border:0;outline:0;font-size:16px;line-height:1.5;padding:6px 0;max-height:150px;min-height:28px;display:block}
.composer textarea::placeholder{color:var(--muted)}
.crow{display:flex;align-items:center;gap:4px}
.crow .sp{margin-left:auto}
.picker{padding:7px 12px;font-size:14px;color:var(--muted)}
.send{width:40px;height:40px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s,box-shadow .3s}
.send:hover:not([disabled]){transform:scale(1.07);box-shadow:0 0 0 5px color-mix(in srgb,var(--fg) 14%,transparent)}
.send[disabled]{opacity:.3}
.menu{position:absolute;bottom:calc(100% + 8px);left:0;min-width:250px;padding:6px;border-radius:16px;z-index:20;
  background:#0A0C10;color:var(--key-fg);border:1px solid var(--key-line);box-shadow:0 18px 44px rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
.menu.r{left:auto;right:0}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;border-radius:11px;font-size:14px;transition:background .2s}
.opt:hover:not([aria-disabled="true"]){background:rgba(255,255,255,.12)}
.opt small{display:block;opacity:.65;font-size:12.5px}
.opt .ck{margin-left:auto;opacity:0}
.opt[aria-checked="true"] .ck{opacity:1}
.opt[aria-disabled="true"]{opacity:.5}
.samples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sample{padding:8px 14px;border-radius:99px;font-size:14px;color:var(--muted);background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);transition:background .25s,color .25s,border-color .25s,transform .25s}
.sample:hover{background:var(--key-bg);color:var(--key-fg);border-color:var(--key-line);transform:translateY(-1px);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin:0}

/* live API states */
#pickMenu{min-width:300px;max-height:min(58vh,440px);overflow-y:auto}
/* empty state: the composer sits mid-screen, so menus open downward instead of off the top */
.main.is-empty .menu{bottom:auto;top:calc(100% + 8px)}
/* the composer (and the menus inside it) must paint above the sample chips and the thread:
   chips use backdrop-filter, so each is its own stacking context and, coming later in the DOM,
   would otherwise cover a menu that opens over them */
.dock .composer{z-index:10}
.opt-grp{padding:8px 12px 4px;font-size:12px;opacity:.6}
.opt[disabled]{opacity:.5;cursor:default}
.tag{font-style:normal;font-size:11px;margin-left:8px;padding:1px 7px;border:1px solid rgba(255,255,255,.3);border-radius:99px;opacity:.85}
.m-text.pending{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.m-text.err,.note.err,.foot.err{color:var(--neg)}
.tide.bin{background:linear-gradient(90deg,color-mix(in srgb,var(--neg) 38%,transparent),color-mix(in srgb,var(--pos) 38%,transparent))}
.w.lx{--c:var(--muted)}

/* fluid highlight that follows the pointer inside buttons, tabs and chat rows */
.fx{position:relative;overflow:hidden;isolation:isolate}
.fx::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--fg) 20%,transparent),transparent 70%)}
.fx:hover::before,.fx:focus-visible::before{opacity:1}
.scrim{display:none}
@media (max-width:820px){
  .shell,.shell[data-side="closed"]{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:30;left:0;top:0;bottom:0;width:min(86vw,300px);transform:translateX(-102%);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
  .side-in{width:100%}
  .shell[data-side="open"] .side{transform:none}
  .shell[data-side="open"] .scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .openside{display:inline-flex}
  .pr{grid-template-columns:72px 1fr 40px}
  .dim{grid-template-columns:96px 1fr 36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-reduced-transparency:reduce){.glass,.menu,.w .tip,.key:hover{-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>

<script>
(function(){
  /* Sentiment Lens frontend. Talks to the demo API in remote-repo/demo/api (contract: remote-repo/demo/README.md).
     Open it through the API at http://127.0.0.1:8000 so requests are same-origin. */
  var API=/^https?:$/.test(location.protocol)?'':'http://127.0.0.1:8000';
  var DIMS=[['polarity','Cực tính'],['valence','Dễ chịu'],['arousal','Hưng phấn'],['dominance','Kiểm soát'],['joy','Vui'],['sadness','Buồn'],
            ['anger','Giận'],['fear','Sợ'],['disgust','Ghê tởm'],['surprise','Ngạc nhiên'],['trust','Tin cậy'],['anticipation','Mong đợi']];
  var LABEL_TEXT={neg:'Tiêu cực',neu:'Trung tính',pos:'Tích cực'};
  var COL={neg:'var(--neg)',neu:'var(--neu)',pos:'var(--pos)'};

  var $=function(id){return document.getElementById(id)};
  var shell=$('shell'), app=$('app'), main=$('main'), threadEl=$('thread'), threadIn=$('threadIn');
  var form=$('form'), ta=$('text'), send=$('send'), recentEl=$('recent'), foot=$('foot');
  var models=[], modelId='uit', nextId=1, activeId=null, busy=false;
  var convs=[];

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(n){return n.toFixed(2).replace('.',',')}
  function signed(n){return (n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(2).replace('.',',')}
  function pct(n){return n<0.01?'<1%':n>0.99?(n*100).toFixed(1).replace('.',',')+'%':Math.round(n*100)+'%'}
  function width(n){return (n*100).toFixed(1)+'%'}
  function icon(id,st){return '<svg class="i"'+(st?' style="'+st+'"':'')+'><use href="#'+id+'"/></svg>'}
  function activeConv(){for(var i=0;i<convs.length;i++) if(convs[i].id===activeId) return convs[i]; return null}
  function modelById(id){for(var i=0;i<models.length;i++) if(models[i].id===id) return models[i]; return null}

  /* API: every error becomes a sentence the user can act on */
  function api(path,body){
    var ctrl=new AbortController(), timer=setTimeout(function(){ctrl.abort()},30000);
    var opts={signal:ctrl.signal};
    if(body){opts.method='POST';opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(body)}
    return fetch(API+path,opts).then(function(res){
      return res.json().catch(function(){return {}}).then(function(data){
        if(!res.ok) throw new Error(data.error||('Máy chủ trả lỗi '+res.status+'.'));
        return data;
      });
    },function(err){
      throw new Error(err&&err.name==='AbortError'
        ?'Máy chủ không phản hồi sau 30 giây. Thử gửi lại.'
        :'Chưa kết nối được máy chủ phân tích. Chạy remote-repo\\demo\\run_api.ps1 rồi mở http://127.0.0.1:8000.');
    }).finally(function(){clearTimeout(timer)});
  }

  function triggerBeam(){
    var w=$('beamWrap');
    if(!w) return;
    w.style.transition='none';
    w.style.opacity='0.6';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        w.style.transition='opacity .6s ease';
        w.style.opacity='1';
      });
    });
  }
  form.addEventListener('click',function(){ triggerBeam() });

  /* border light: 72 touching dashes around the perimeter (small enough colour steps to be invisible
     on a white background), colours cycle the palette once, brightness has two soft peaks;
     a negative animation-delay places dash k at k/72 of the loop.
     Colours are solid (dimmed by mixing toward --beam-dim, not by opacity) so the small overlaps
     that hide anti-aliasing gaps do not show up as brighter dots. */
  (function buildBeam(){
    var line=$('beamLine'), glow=$('beamGlow');
    if(!line||!glow) return;
    var N=72, STEP=100/N, PERIOD=9, NS='http://www.w3.org/2000/svg';
    var stops=['--bc1','--bc2','--bc3','--bc4'];
    for(var k=0;k<N;k++){
      var u=k/N, seg=u*4, i=Math.floor(seg), f=seg-i;
      var hue='color-mix(in oklab, var('+stops[i]+') '+((1-f)*100).toFixed(1)+'%, var('+stops[(i+1)%4]+'))';
      var bright=(40+60*(0.5+0.5*Math.cos(2*Math.PI*2*k/N))).toFixed(1);
      var color='color-mix(in oklab, '+hue+' '+bright+'%, var(--beam-dim))';
      [glow,line].forEach(function(group){
        var r=document.createElementNS(NS,'rect');
        r.setAttribute('pathLength','100');
        r.style.stroke=color;
        r.style.strokeDasharray=(STEP+0.15).toFixed(3)+' '+(100-STEP-0.15).toFixed(3);
        r.style.animationDelay=(-k/N*PERIOD).toFixed(3)+'s';
        group.appendChild(r);
      });
    }
  })();

  /* sidebar */
  var mq=window.matchMedia('(max-width: 820px)');
  function setSide(open){shell.setAttribute('data-side',open?'open':'closed')}
  setSide(!mq.matches);
  $('sideClose').addEventListener('click',function(){setSide(false)});
  $('sideOpen').addEventListener('click',function(){setSide(true)});
  $('scrim').addEventListener('click',function(){setSide(false)});

  function renderRecent(){
    var q=$('search').value.trim().toLowerCase();
    recentEl.innerHTML='';
    var shown=convs.filter(function(c){return !q||c.title.toLowerCase().indexOf(q)>-1});
    if(!shown.length){var p=document.createElement('p');p.className='none';p.textContent=q?'Không có cuộc trò chuyện khớp.':'Chưa có cuộc trò chuyện.';recentEl.appendChild(p);return}
    shown.forEach(function(c){
      var b=document.createElement('button');b.type='button';b.className='rec fx';b.textContent=c.title;
      if(c.id===activeId) b.setAttribute('aria-current','true');
      b.addEventListener('click',function(){activeId=c.id;render();triggerBeam();if(mq.matches)setSide(false)});
      recentEl.appendChild(b);
    });
  }
  $('search').addEventListener('input',renderRecent);
  $('newChat').addEventListener('click',function(){activeId=null;render();ta.focus();if(mq.matches)setSide(false)});

  /* theme (dark first) */
  $('theme').addEventListener('click',function(){
    var r=document.documentElement;
    r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light');
  });

  /* popover menus */
  var openMenu=null;
  function closeMenus(){
    [['plus','plusMenu'],['picker','pickMenu']].forEach(function(p){$(p[0]).setAttribute('aria-expanded','false');$(p[1]).hidden=true});
    openMenu=null;
  }
  function toggleMenu(btn,menu){
    var was=!$(menu).hidden; closeMenus();
    if(!was){$(menu).hidden=false;$(btn).setAttribute('aria-expanded','true');openMenu=menu;fitMenu($(menu))}
  }
  /* keep the open menu inside the viewport: shrink it to the space actually available (it scrolls inside) */
  function fitMenu(el){
    el.style.maxHeight='';
    var r=el.getBoundingClientRect(), gap=12;
    if(r.bottom>innerHeight-gap) el.style.maxHeight=Math.max(160,innerHeight-gap-r.top)+'px';
    else if(r.top<gap) el.style.maxHeight=Math.max(160,r.bottom-gap)+'px';
  }
  $('plus').addEventListener('click',function(e){e.stopPropagation();toggleMenu('plus','plusMenu')});
  $('picker').addEventListener('click',function(e){e.stopPropagation();toggleMenu('picker','pickMenu')});
  document.addEventListener('click',function(e){ if(openMenu && !e.target.closest('.menu')) closeMenus() });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeMenus() });

  /* model picker: every model the API serves, grouped like ChatGPT / Grok */
  function renderPicker(){
    var m=$('pickMenu'); m.innerHTML='';
    if(!models.length){
      var e=document.createElement('div');e.className='opt';e.setAttribute('aria-disabled','true');
      e.innerHTML=icon('i-bolt')+'<span>Chưa tải được danh sách mô hình<small>Kiểm tra máy chủ phân tích</small></span>';
      m.appendChild(e);return;
    }
    [['Khuyên dùng',true],['Đối chiếu',false]].forEach(function(g){
      var list=models.filter(function(md){return md.recommended===g[1]});
      if(!list.length) return;
      var h=document.createElement('div');h.className='opt-grp';h.textContent=g[0];m.appendChild(h);
      list.forEach(function(md){
        var b=document.createElement('button');b.type='button';b.className='opt fx';b.setAttribute('role','menuitemradio');
        b.setAttribute('aria-checked',md.id===modelId?'true':'false');
        if(!md.available) b.disabled=true;
        var tag=md.labels.length===2?'<em class="tag">2 nhãn</em>':'';
        b.innerHTML=icon(md.recommended?'i-bolt':'i-bulb')+'<span>'+esc(md.name)+tag+'<small>'+esc(md.available?md.description:'Thiếu checkpoint trên máy')+'</small></span><span class="ck">'+icon('i-check')+'</span>';
        b.addEventListener('click',function(){
          if(!md.available) return;
          modelId=md.id;$('pickerLabel').textContent=md.name;renderPicker();closeMenus();ta.focus();
        });
        m.appendChild(b);
      });
    });
    var d=document.createElement('div');d.className='opt';d.setAttribute('role','menuitem');d.setAttribute('aria-disabled','true');
    d.innerHTML=icon('i-image')+'<span>VLM toàn năng<small>Sắp có</small></span>';
    m.appendChild(d);
  }

  function setFoot(error){
    foot.textContent=error||'Chạy trên máy này: PhoBERT kết hợp từ điển cảm xúc 12 chiều. Đổi mô hình ở ô nhập.';
    foot.classList.toggle('err',!!error);
  }

  var samples=$('samples');
  function renderSamples(list){
    samples.innerHTML='';
    list.forEach(function(text){
      var b=document.createElement('button');b.type='button';b.className='sample fx';b.textContent=text;
      b.addEventListener('click',function(){ if(busy) return; ta.value=text;fit();form.requestSubmit() });
      samples.appendChild(b);
    });
  }

  function loadModels(){
    api('/api/models').then(function(list){
      models=list;
      var cur=modelById(modelId);
      if(!cur||!cur.available){
        var pick=list.filter(function(md){return md.available&&md.recommended})[0]||list.filter(function(md){return md.available})[0];
        if(pick) modelId=pick.id;
      }
      var md=modelById(modelId); if(md) $('pickerLabel').textContent=md.name;
      renderPicker(); setFoot();
    }).catch(function(err){models=[];renderPicker();setFoot(err.message)});
    api('/api/samples').then(renderSamples).catch(function(){renderSamples([])});
  }

  /* composer */
  function fit(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,150)+'px'}
  function setBusy(b){busy=b;send.disabled=b||!ta.value.trim();form.classList.toggle('busy',b)}
  ta.addEventListener('input',function(){send.disabled=busy||!ta.value.trim();fit()});
  ta.addEventListener('keydown',function(e){
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){e.preventDefault();if(!send.disabled) form.requestSubmit()}
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=ta.value.trim(); if(!v||busy) return;
    var c=activeConv();
    if(!c){c={id:nextId++,title:v.length>38?v.slice(0,38)+'…':v,msgs:[]};convs.unshift(c);activeId=c.id}
    var md=modelById(modelId);
    var msg={role:'ai',pending:true,text:v,model:modelId,modelName:md?md.name:modelId};
    c.msgs.push({role:'user',text:v});
    c.msgs.push(msg);
    ta.value='';fit();setBusy(true);render();
    api('/api/predict',{text:v,model:modelId,lexicon:true})
      .then(function(res){msg.result=res;msg.fresh=true})
      .catch(function(err){msg.error=err.message})
      .then(function(){msg.pending=false;setBusy(false);if(activeConv()===c) render(); else renderRecent()});
  });

  /* messages */
  function buildAI(m){
    var el=document.createElement('div');el.className='m-ai';
    if(m.pending){
      var w=document.createElement('p');w.className='m-text pending';w.textContent=m.modelName+' đang phân tích…';
      el.appendChild(w);return el;
    }
    if(m.error){
      var p=document.createElement('p');p.className='m-text err';p.textContent=m.error;
      el.appendChild(p);return el;
    }
    var res=m.result, keys=Object.keys(res.probs), binary=keys.indexOf('neu')<0, sel=null, showing=res;
    el.innerHTML=
      '<div class="verdict"><span class="word"></span><span class="pct"></span></div>'+
      '<div class="tide-wrap"><div class="tide'+(binary?' bin':'')+'"><span class="drop"></span></div><div class="tide-labels">'+
        (binary?'<span>Tiêu cực</span><span>Tích cực</span>':'<span>Tiêu cực</span><span>Trung tính</span><span>Tích cực</span>')+'</div></div>'+
      '<div class="sentence"></div>'+
      '<p class="note trunc" hidden>Câu dài quá giới hạn 256 đơn vị từ, phần cuối không được đưa vào mô hình.</p>'+
      '<details class="glass"><summary>Vì sao?</summary><div class="why">'+
        '<label class="switch"><input type="checkbox" checked><span class="trk"></span><span>Dùng từ điển cảm xúc</span></label>'+
        '<div class="probs"></div>'+
        '<p class="note lexnote" hidden>Đang tắt từ điển lúc suy luận trên chính mô hình đã huấn luyện kèm từ điển. Đây không phải mô hình đối chứng huấn luyện riêng (baseline A).</p>'+
        '<p class="note err lexerr" hidden></p>'+
        '<div><p class="note dimhead" style="margin-bottom:10px"></p><div class="dims"></div></div>'+
        '<p class="src"></p></div></details>';
    var q=function(s){return el.querySelector(s)}, lex=q('input[type=checkbox]'), drop=q('.drop'), sent=q('.sentence');
    q('.trunc').hidden=!res.truncated;

    function xOf(p){return ((((p.pos||0)-(p.neg||0))+1)/2*100).toFixed(1)+'%'}
    function paint(setTone){
      var r=showing, k=r.label_key, md=r.model;
      q('.word').textContent=r.label;
      q('.pct').textContent=pct(r.probs[k]);
      drop.style.setProperty('--x',xOf(r.probs));
      var box=q('.probs');box.innerHTML='';
      keys.forEach(function(key){
        var row=document.createElement('div');row.className='pr';
        row.innerHTML='<span>'+LABEL_TEXT[key]+'</span><span class="t"><span class="f" style="--c:'+COL[key]+';width:'+width(r.probs[key])+'"></span></span><span class="v">'+pct(r.probs[key])+'</span>';
        box.appendChild(row);
      });
      q('.lexnote').hidden=r.lexicon;
      var dev=md.dev_macro_f1!=null?', dev macro-F1 '+fmt(md.dev_macro_f1):'';
      q('.src').textContent=md.name+': '+md.checkpoint+', lexicon '+md.lexicon_version+dev+'. '+
        r.coverage.in_lexicon+'/'+r.coverage.words+' từ có trong từ điển. '+r.latency_ms+' ms.';
      paintWords();
      if(setTone) shell.setAttribute('data-tone',k);
    }
    /* word tint: colour from the lexicon polarity sign, strength from lexicon_ratio
       (the learned gate barely varies between words, so it is shown as a number only) */
    function paintWords(){
      sent.innerHTML='';
      showing.tokens.forEach(function(t,i){
        var b=document.createElement('button');b.type='button';
        var pol=t.dims&&t.dims.polarity!=null?t.dims.polarity:null;
        b.className='w '+(!t.in_lexicon?'':pol!=null&&pol>0.05?'pos':pol!=null&&pol<-0.05?'neg':'lx');
        var s=t.lexicon_ratio!=null?Math.min(1,t.lexicon_ratio/0.8):(t.in_lexicon?0.25:0);
        b.style.setProperty('--s',s.toFixed(2));
        b.setAttribute('aria-pressed',i===sel?'true':'false');
        b.textContent=t.word.replace(/_/g,' ');
        var tip=document.createElement('span');tip.className='tip';
        tip.textContent=!t.in_lexicon?'Không có trong từ điển'
          :(t.lexicon_ratio!=null?'Từ điển đóng góp '+fmt(t.lexicon_ratio)+', gate '+fmt(t.gate):'Có trong từ điển (đang tắt)')+
           (pol!=null?', cực tính '+signed(pol):'');
        b.appendChild(tip);
        b.addEventListener('click',function(){sel=i;paintWords();dims();var d=q('details');if(!d.open) d.open=true});
        sent.appendChild(b);
      });
    }
    function dims(){
      var box=q('.dims'),head=q('.dimhead');box.innerHTML='';
      if(sel===null){head.textContent='Chọn một từ trong câu để xem 12 chiều từ điển.';return}
      var t=showing.tokens[sel],name=t.word.replace(/_/g,' ');
      if(!t.in_lexicon){head.textContent='“'+name+'” không có trong từ điển, nên mô hình giữ nguyên biểu diễn của PhoBERT.';return}
      head.textContent='12 chiều của “'+name+'”. Dấu — là nguồn từ điển không có dữ liệu cho chiều đó.';
      DIMS.forEach(function(d,i){
        var v=t.dims[d[0]], row=document.createElement('div');row.className='dim';
        var cls=i===0&&v!=null?(v>=0?'pos':'neg'):'';
        var barW=v==null?0:Math.round(Math.abs(v)*100);
        row.innerHTML='<span>'+d[1]+'</span><span class="t"><span class="f '+cls+'" style="width:'+barW+'%"></span></span><span class="v">'+
          (v==null?'—':(i===0?signed(v):fmt(v)))+'</span>';
        box.appendChild(row);
      });
    }
    lex.addEventListener('change',function(){
      var last=el.dataset.last==='1';
      q('.lexerr').hidden=true;
      if(lex.checked){showing=res;paint(last);dims();return}
      if(m.plain){showing=m.plain;paint(last);dims();return}
      lex.disabled=true;
      api('/api/predict',{text:m.text,model:m.model,lexicon:false})
        .then(function(r){m.plain=r;if(!lex.checked){showing=r;paint(last);dims()}})
        .catch(function(err){lex.checked=true;var e=q('.lexerr');e.textContent=err.message;e.hidden=false})
        .then(function(){lex.disabled=false});
    });
    dims();
    paint(false);
    if(m.fresh){
      var target=xOf(res.probs);
      drop.style.setProperty('--x','50%');
      requestAnimationFrame(function(){requestAnimationFrame(function(){drop.style.setProperty('--x',target)})});
      triggerBeam();
      m.fresh=false;
    }
    el._paint=paint;
    return el;
  }

  function render(){
    var c=activeConv();
    var empty=!c||!c.msgs.length;
    main.classList.toggle('is-empty',empty);
    samples.hidden=!empty;
    threadIn.innerHTML='';
    var lastAI=null;
    if(empty){
      var h=document.createElement('h1');h.className='empty-h';h.innerHTML='Mô hình nghĩ gì<br>về câu này?';threadIn.appendChild(h);
    }else{
      var lastIdx=-1;
      c.msgs.forEach(function(m,i){ if(m.role==='ai'&&m.result) lastIdx=i });
      c.msgs.forEach(function(m,i){
        if(m.role==='user'){
          var u=document.createElement('div');u.className='m-user glass';u.textContent=m.text;threadIn.appendChild(u);
        }else{
          var ai=buildAI(m);threadIn.appendChild(ai);
          if(i===lastIdx){ai.dataset.last='1';lastAI=ai}
        }
      });
    }
    app.classList.toggle('has-result',!!lastAI);
    if(lastAI){
      lastAI._paint(true);
    }else{
      shell.setAttribute('data-tone','');
    }
    renderRecent();
    threadEl.scrollTop=threadEl.scrollHeight;
  }

  document.addEventListener('pointermove',function(e){
    var t=e.target.closest&&e.target.closest('.fx'); if(!t) return;
    var r=t.getBoundingClientRect();
    t.style.setProperty('--mx',(e.clientX-r.left)+'px');
    t.style.setProperty('--my',(e.clientY-r.top)+'px');
  });

  renderPicker();
  render();
  loadModels();
  triggerBeam();
})();
</script>
