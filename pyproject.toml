[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-sentiment"
version = "0.1.0"
description = "Contextual and lexical Vietnamese sentiment foundation"
requires-python = ">=3.12"
dependencies = ["torch>=2.0", "transformers>=4.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
